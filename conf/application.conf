include "backend.conf"

# This is the main configuration file for the application.
# ~~~~~

appName = construction-industry-scheme-external-stub

# Default http client
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"

# Play Modules
play.modules.enabled += "uk.gov.hmrc.constructionindustryschemeexternalstub.Module"


# The application languages
# ~~~~~
play.i18n.langs = ["en"]

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
# !!!WARNING!!! DO NOT CHANGE THIS ROUTER
play.http.router = prod.Routes

# Controller
# ~~~~~
# By default all controllers will have authorisation, logging and
# auditing (transaction monitoring) enabled.
# The below controllers are the default exceptions to this rule.

# Microservice specific config

microservice {
  services {
    auth {
      host = localhost
      port = 8500
    }
  }
}

perfMode = false

stub {
  # Service name to call back for polling
  polling.callback = "http://localhost:9712/"
  polling.acknowledgement.callback = "http://localhost:9712/"

  # Service specific urls
  HMRC-VAT-DEC {
    poll = "submission/ChRIS/poll/HMRC-VAT-DEC"
    response = "submission/ChRIS/HMRC-VAT-DEC/Filing/data"
  }
  HMRC-SA-SA100 {
    poll = "submission/ChRIS/poll/HMRC-SA-SA100"
    response = "submission/ChRIS/HMRC-SA-SA100/Filing/data"
  }
  IR-PAYE-EXB {
    poll = "submission/ChRIS/poll/IR-PAYE-EXB"
    response = "submission/ChRIS/IR-PAYE-EXB/Filing/data"
  }
  HMRC-FATCA-ORG {
    response = "submission/ChRIS/FATCA/Registration/data"
  }
  HMRC-FATCA-RETURN {
    response = "submission/ChRIS/FATCA/Filing/data"
    poll = "submission/ChRIS/poll/HMRC-FATCA-RETURN"
  }
  IR-SDLT-LTR {
    response = "submission/SDLT/Filing/sync/SDLT-RETURN"
    poll = "submission/ChRIS/poll/SDLT-RETURN"
  }
  HMRC-CHAR-CLM {
    response = "submission/ChRIS/Charities/Filing/data"
    poll = "submission/ChRIS/poll/HMRC-CHAR-CLM"
  }
  IR-CIS-CIS300MR {
    poll = "submission/ChRIS/poll/IR-CIS-CIS300MR"
    response = "submission/ChRIS/IR-CIS-CIS300MR/Filing/data"
    stubPoll = "stubs/ChRIS/CISR/Filing/action"
  }
  IR-CIS-VERIFY {
    poll = "submission/ChRIS/poll/IR-CIS-VERIFY"
    response = "submission/ChRIS/IR-CIS-VERIFY/Filing/data"
  }

  # Endpoint Behaviour
  # ~~~~~
  # Configuration for how endpoints behave based on particular conditions

  # Comma separated list of tax office number / reference
  # If a tax office number / reference is set in this list then it will mean that any submission to go through
  # the system for that office will be set to PENDINNG rather than SUBMITTED for successful submissions.
  # This is so that we can test pending submission states.
  endpoint.submission.cis.filing.acknowledgeFilter.0 = "754/EZ00100"
  endpoint.submission.cis.filing.acknowledgeFilter.1 = "755/EZ00100"
  endpoint.submission.cis.filing.acknowledgeFilter.2 = "756/EZ00100"
  endpoint.submission.cis.filing.acknowledgeFilter.3 = "757/EZ00100"
  endpoint.submission.cis.filing.acknowledgeFilter.4 = "758/EZ00100"
  endpoint.submission.cis.filing.fatalErrorFilter.0 = "754/EZ00125"
  endpoint.submission.cis.filing.businessErrorFilter.0 = "754/EZ00150"

  endpoint.submission.cis.polling.statusMap {
    754 = "SUBMITTED"
    755 = "FATAL_ERROR"
    756 = "DEPARTMENTAL_ERROR"
    757 = "SUBMITTED_NO_RECEIPT"
    758 = "ACKNOWLEDGE"
  }
}