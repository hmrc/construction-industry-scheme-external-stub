include "application.conf"

perfMode = false

stub {
  # Service name to call back for polling
  polling.callback = "http://localhost/"
  # Service name to call back for acknowledgement stubbing
  polling.acknowledgement.callback = "http://localhost/"

  # Service specific urls
  IR-CIS-CIS300MR {
    poll = "submission/ChRIS/poll/IR-CIS-CIS300MR"
    response = "submission/ChRIS/IR-CIS-CIS300MR/Filing/data"
    stubPoll = "stubs/ChRIS/CISR/Filing/action"
  }
  IR-CIS-VERIFY {
    poll = "submission/ChRIS/poll/IR-CIS-VERIFY"
    response = "submission/ChRIS/IR-CIS-VERIFY/Filing/data"
  }
}

stub.polling.acknowledgement.callback = "http://localhost.acknowledgement/"
stub.endpoint.submission.cis.filing.acknowledgeFilter.0 = "123/GL01"